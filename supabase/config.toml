project_id = "equipedesk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback", "http://localhost:3000/recuperar"]
jwt_expiry = 3600
minimum_password_length = 8
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_expiry = 900
max_frequency = "60s"


[auth.email.template.confirmation]
subject = "Confirme seu cadastro"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Acesse sua conta"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Convite de acesso"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirme a alteração de e-mail"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Confirme esta operação"
content_path = "./supabase/templates/reauthentication.html"
